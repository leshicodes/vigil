services:
  vigil:
    image: leshicodes/vigil:edge
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Uncomment to develop hooks without rebuilding:
      # - ./hooks:/home/vigil/hooks
    env_file:
      - .env
    # For real USB cameras, you MUST pass the device and add the video group:
    # devices:
    #   - "/dev/video0:/dev/video0"
    # group_add:
    #   - video
    restart: unless-stopped